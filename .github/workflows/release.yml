name: Release docset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rocq_version:
        description: Rocq release version to build
        required: true
        default: 9.2.0
        type: string

permissions:
  contents: write

jobs:
  build-docset:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install NuShell
        run: cargo install nu --locked --version 0.116.1

      - name: Determine Rocq version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.rocq_version || github.event.release.tag_name }}
        run: |
          version="${REQUESTED_VERSION#v}"
          version="${version#V}"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vX.Y.Z or VX.Y.Z; got '$REQUESTED_VERSION'." >&2
            exit 1
          fi

          echo "rocq_version=$version" >> "$GITHUB_OUTPUT"

      - name: Build docset
        run: nu build.nu "${{ steps.version.outputs.rocq_version }}"

      - name: Archive docset
        id: archive
        env:
          ROCQ_VERSION: ${{ steps.version.outputs.rocq_version }}
        run: |
          archive="build/Rocq-${ROCQ_VERSION}.docset.tar.gz"
          tar --create --gzip --file="$archive" \
            --directory="build/dash-docset-rocq-${ROCQ_VERSION}" \
            Rocq.docset
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rocq-${{ steps.version.outputs.rocq_version }}.docset
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.archive.outputs.path }}
